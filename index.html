<!doctype html>
<html lang="he" dir="rtl" data-theme="natural">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OR Design Studio · קטלוג מארזים</title>
<meta name="description" content="קטלוג מארזים 2026 — OR Design Studio · מיתוג ומתנות לאירועים">
<meta name="theme-color" content="#F6EFE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Palettes ===== */
:root, [data-theme="natural"]{
  --bg:#F6EFE4; --surface:#FDFCF4; --soft:#EFE3D1; --line:#E2D1B9;
  --ink:#3B2A20; --muted:#8A7563; --accent:#6B4A35; --accent-ink:#FDFCF4; --tag:#C6A37F;
}
[data-theme="bordeaux"]{
  --bg:#EBE3D8; --surface:#F7F2EB; --soft:#E2E9EF; --line:#D9CFC2;
  --ink:#521C24; --muted:#7D6166; --accent:#521C24; --accent-ink:#F7F2EB; --tag:#B4C7D6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;font-size:16px;line-height:1.5;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* ===== Hero ===== */
header.hero{text-align:center;padding:28px 16px 18px}
.logo{width:150px;margin:0 auto;color:var(--ink)}
.logo svg{width:100%;height:auto;display:block}
.tagline{letter-spacing:.28em;font-size:11px;color:var(--muted);margin-top:8px;direction:ltr}
h1{font-family:"Rubik",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:34px;margin:18px 0 4px}
.sub{color:var(--muted);margin:0;font-size:15px}
.palette{position:absolute;top:14px;inset-inline-start:14px;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px}
.palette button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.palette .p-natural{background:linear-gradient(135deg,#F6E7D2 50%,#6B4A35 50%)}
.palette .p-bordeaux{background:linear-gradient(135deg,#EBE3D8 50%,#521C24 50%)}

/* ===== Sticky filters ===== */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;min-width:0}
.search svg{flex:none;opacity:.55}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:8px}
.meta select{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0}

/* ===== Grid ===== */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 0 120px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line);text-align:start;padding:0;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:4/5;background:var(--soft);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .count{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px}
.card .in{position:absolute;top:8px;inset-inline-end:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;border-radius:99px;padding:2px 8px;font-weight:600}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{font-family:"Rubik",sans-serif;font-weight:600;letter-spacing:-.01em;font-size:16px;line-height:1.25;margin:0}
.card .tagl{font-size:12.5px;color:var(--muted);line-height:1.3}
.card .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:18px}
.price small{font-weight:400;font-size:12px;color:var(--muted)}
.min{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* ===== Sheet ===== */
.scrim{position:fixed;inset:0;background:rgba(30,20,15,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:22px 22px 0 0;z-index:50;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .x{position:absolute;top:10px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.85);z-index:3;font-size:20px;line-height:1;color:#333}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:8px}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;background:var(--soft)}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots span.on{background:var(--ink);width:16px;border-radius:9px}
.detail{padding:12px 20px 20px}
.detail h2{font-family:"Rubik",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:26px;margin:0;line-height:1.2}
.detail .tagl{color:var(--muted);margin-top:2px}
.pill{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 12px;font-size:13px;margin-top:10px}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.variant{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:transparent;text-align:start;flex:1;min-width:130px}
.variant[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.variant b{display:block;font-size:17px}
.variant span{font-size:13px;color:var(--muted)}
.bigprice{font-size:28px;font-weight:700;margin-top:12px}
.bigprice small{font-size:14px;font-weight:400;color:var(--muted)}
h4{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:600}
ul.inc{list-style:none;margin:0;padding:0}
ul.inc li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul.inc li:last-child{border:0}
ul.inc li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--tag);margin-top:9px}
ul.inc li small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
.buy{flex:none;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:var(--surface)}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;height:50px}
.qty button{width:40px;height:100%;border:0;background:transparent;font-size:22px}
.qty input{width:52px;text-align:center;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:17px;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{display:none}
.cta{flex:1;height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.cta.wa{background:#1F8F4E;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.err{color:#B3261E;font-size:13px;padding:0 16px 6px;display:none}

/* ===== Basket bar ===== */
.basket{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline:16px;max-width:520px;margin:0 auto;z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 10px 30px rgba(40,25,15,.25);transform:translateY(140%);transition:transform .3s}
.basket.show{transform:none}
.basket .n{background:var(--accent-ink);color:var(--accent);border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-weight:700;font-size:14px;margin-inline-end:8px}
.basket b{font-size:16px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-family:"Rubik",sans-serif;font-weight:600;line-height:1.2}
.line .t span{font-size:13px;color:var(--muted)}
.line .qty{height:38px;border-radius:10px}
.line .qty button{width:30px;font-size:18px}
.line .qty input{width:44px;font-size:15px}
.rm{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0}
.total{display:flex;justify-content:space-between;font-size:18px;padding:14px 0 4px;font-weight:700}
.fine{font-size:12.5px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 110px}

/* ===== Branding everywhere ===== */
.lg svg{width:100%;height:auto;display:block}
.mini{display:flex;justify-content:center;align-items:center;height:0;opacity:0;overflow:hidden;transition:height .25s,opacity .25s,margin .25s}
.mini .lg{width:100px;color:var(--ink)}
.bar.stuck .mini{height:68px;opacity:1;margin-bottom:6px}
.basket .bm{width:48px;color:var(--accent-ink);flex:none}
.basket .mid{display:flex;align-items:center;flex:1;justify-content:center}
.sheet-brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 0 6px;color:var(--ink)}
.sheet-brand .lg{width:84px}
.sheet-brand span{font-size:10px;letter-spacing:.28em;color:var(--muted);direction:ltr}
.cart-head{display:flex;align-items:center;gap:12px}
.cart-head .lg{width:62px;color:var(--ink);flex:none}
.cta.wa .who{font-weight:400;opacity:.9}
footer .lg{width:90px;margin:0 auto 10px;color:var(--ink)}
</style>
</head>

 {id:"flower",name:"מארז נר ריחני פרח",tag:"בקופסה חצי שקופה",cat:"נרות עבודת יד",min:25,v:[["",17]],img:["p14_1"],inc:["נר ריחני בצורת פרח, עבודת יד","קופסה חצי שקופה","סרט פשתן","חותמת שעווה","פתק מזכרת"],pop:1},
 {id:"sunflower",name:"מארז נר חמניה",tag:"פרח חמניה לבן ריחני",cat:"נרות עבודת יד",min:30,v:[["",16]],img:["p15_0"],inc:["דף הקדשה","פרח חמניה לבן ריחני, עבודת יד","עטוף בצלופן"]},
 {id:"mini",name:"מארז מיני יוקרתי",tag:"נר בבל בעטיפה מותאמת",cat:"נרות עבודת יד",min:30,v:[["",16]],img:["p15_1"],inc:["נר בבל ריחני עבודת יד","עיצוב עטיפת נייר מותאמת עם הקדשה אישית","פפיון סאטן"]},
 {id:"fans",name:"מניפות ממותגות",tag:"עם הקדשה אישית",cat:"מזכרות ומיתוג",min:30,v:[["",12]],img:["p13_0"],inc:["מניפה","מיתוג למניפה עם הקדשה אישית","סרט פשתן"]},
 {id:"bracelet",name:"מארז צמיד עין הרע",tag:"עם דף הקדשה",cat:"מזכרות ומיתוג",min:35,v:[["",12]],img:["p19_0"],inc:["דף הקדשה","צמיד עין הרע","עטוף בנייר צלופן"]},
 {id:"newborn",name:"כרטיס ניו בורן מתוק",tag:"בלון עם מיני מרשמלו",cat:"מזכרות ומיתוג",min:40,v:[["",13]],img:["p19_1"],inc:["דף מעוצב","בלון ממולא במיני מרשמלו"]},
 {id:"ring",name:"מארז טבעת זהב",tag:"סוכריות דרז׳ה בטול לבן",cat:"מזכרות ומיתוג",min:30,v:[["",12]],img:["p20_0","p20_1"],inc:["סוכריות דרז׳ה לבנות","טבעת זהב","עטוף בטול לבן","תג מזכרת"]},
 {id:"headscarf",name:"כיסוי ראש ממותג",tag:"מטפחת ראש + חובק ממותג",cat:"מזכרות ומיתוג",min:20,v:[["",16]],img:["p20_2"],inc:["מטפחת ראש","חובק ממותג"]},
 {id:"acrylic-custom",name:"אקריליק בעיצוב אישי",tag:"לפי צורה לבחירה",cat:"מזכרות ומיתוג",min:40,v:[["",null]],img:["p20_3"],inc:["אקריליק מעוצב אישית לפי צורה","גדיל","עטוף בצלופן ופפיון","אפשר להוסיף ברכה לבחירה"],note:"הצעת מחיר לפי כמות וצורה"}
];

/* ======= עזרים ======= */
const $ = s => document.querySelector(s);
const fmt = n => n==null ? "הצעת מחיר" : "₪" + (Number.isInteger(n)?n:n.toFixed(1));
const src = n => "img/" + n + ".jpg";
const fromPrice = p => Math.min(...p.v.map(x=>x[1] ?? Infinity));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ======= לוגו בכל מקום ======= */
const LOGO = document.querySelector(".logo svg").outerHTML;
const logoIn = root => root.querySelectorAll("[data-logo]").forEach(el=>{if(!el.firstChild)el.innerHTML=LOGO});
logoIn(document);
const brandHTML = `<div class="sheet-brand"><div class="lg" data-logo></div><span>EVENT BRANDING &amp; GIFTING</span></div>`;
// לוגו קטן בפס העליון כשגוללים מתחת ללוגו הגדול
new IntersectionObserver(([e])=>document.querySelector(".bar").classList.toggle("stuck",!e.isIntersecting),{threshold:0}).observe(document.querySelector(".logo"));

/* ======= פלטה ======= */
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll("[data-set-theme]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.setTheme===t));document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();store.set("or-theme",t)}
document.querySelectorAll("[data-set-theme]").forEach(b=>b.onclick=()=>setTheme(b.dataset.setTheme));
setTheme(new URLSearchParams(location.search).get("theme")||store.get("or-theme","natural"));

/* ======= מצב ======= */
let cat="הכל", q="", sort="";
let cart = store.get("or-cart",[]); // [{id,vi,qty}]

/* ======= קטגוריות ======= */
$("#chips").innerHTML = CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
$("#chips").onclick = e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("#q").oninput = e=>{q=e.target.value.trim();render()};
$("#sort").onchange = e=>{sort=e.target.value;render()};

/* ======= גריד ======= */
function render(){
  let list = P.filter(p=>(cat==="הכל"||p.cat===cat) && (!q || (p.name+" "+p.tag+" "+p.inc.flat().join(" ")).includes(q)));
  if(sort==="asc") list.sort((a,b)=>fromPrice(a)-fromPrice(b));
  if(sort==="desc") list.sort((a,b)=>(fromPrice(b)===Infinity?-1:fromPrice(b))-(fromPrice(a)===Infinity?-1:fromPrice(a)));
  if(sort==="min") list.sort((a,b)=>(a.min??0)-(b.min??0));
  $("#count").textContent = list.length + " מארזים";
  $("#grid").innerHTML = list.length ? list.map(p=>{
    const n = cart.filter(c=>c.id===p.id).reduce((s,c)=>s+c.qty,0);
    const fp = fromPrice(p);
    return `<button class="card" data-id="${p.id}">
      <div class="ph"><img src="${src(p.img[0])}" alt="${esc(p.name)}" loading="lazy">${p.img.length>1?`<span class="count">${p.img.length} תמונות</span>`:""}${n?`<span class="in">✓ ${n} ברשימה</span>`:""}</div>
      <div class="body"><h3>${esc(p.name)}</h3><div class="tagl">${esc(p.tag)}</div>
      <div class="row"><span class="price">${fp===Infinity?'<small>הצעת מחיר</small>':(p.v.length>1?'<small>החל מ־</small>':'')+(fp===Infinity?'':fmt(fp))}</span>${p.min?`<span class="min">מינ׳ ${p.min}</span>`:""}</div></div></button>`}).join("")
    : `<div class="empty">לא נמצאו מארזים. נסו מילה אחרת 🙂</div>`;
}
$("#grid").onclick = e=>{const c=e.target.closest(".card");if(c)openProduct(c.dataset.id)};

/* ======= חלונית ======= */
const sheet=$("#sheet"), scrim=$("#scrim");
function openSheet(html){const was=sheet.classList.contains("open");sheet.innerHTML=`<div class="grab"></div><button class="x" aria-label="סגירה">×</button>`+html;sheet.classList.add("open");scrim.classList.add("open");document.body.style.overflow="hidden";sheet.querySelector(".x").onclick=closeSheet;logoIn(sheet);if(!was)history.pushState({s:1},"")}
function closeSheet(fromPop){if(!sheet.classList.contains("open"))return;sheet.classList.remove("open");scrim.classList.remove("open");document.body.style.overflow="";if(fromPop!==true&&history.state&&history.state.s)history.back()}
scrim.onclick=closeSheet;
addEventListener("popstate",()=>closeSheet(true));
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
// סגירה בגרירה למטה
let sy=null;sheet.addEventListener("touchstart",e=>{const sc=sheet.querySelector(".scroll");if(!sc||sc.scrollTop<=0)sy=e.touches[0].clientY},{passive:true});
sheet.addEventListener("touchmove",e=>{if(sy==null)return;const d=e.touches[0].clientY-sy;if(d>0&&!e.target.closest(".gallery"))sheet.style.transform=`translateY(${d}px)`},{passive:true});
sheet.addEventListener("touchend",e=>{if(sy==null)return;const d=e.changedTouches[0].clientY-sy;sheet.style.transform="";sy=null;if(d>110)closeSheet()});

function incHTML(p){return p.inc.map(i=>Array.isArray(i)?`<li><div>${esc(i[0])}${i[1]?`<small>${esc(i[1])}</small>`:""}</div></li>`:`<li><div>${esc(i)}</div></li>`).join("")}

function openProduct(id){
  const p=P.find(x=>x.id===id); let vi=0;
  const minQ=p.min||1, quote=p.v[0][1]==null;
  openSheet(`<div class="scroll">
    <div class="gallery" id="gal">${p.img.map(i=>`<img src="${src(i)}" alt="${esc(p.name)}">`).join("")}</div>
    ${p.img.length>1?`<div class="dots" id="dots">${p.img.map((_,i)=>`<span class="${i?"":"on"}"></span>`).join("")}</div>`:""}
    <div class="detail">
      <h2>${esc(p.name)}</h2><div class="tagl">${esc(p.tag)}</div>
      ${p.min?`<span class="pill">מינימום ${p.min} יחידות</span>`:""}
      ${p.v.length>1?`<div class="variants" id="vars">${p.v.map((v,i)=>`<button class="variant" data-i="${i}" aria-pressed="${i===0}"><b>${fmt(v[1])}</b><span>${esc(v[0])}</span></button>`).join("")}</div>`
        :`<div class="bigprice">${fmt(p.v[0][1])} ${quote?"":"<small>ליחידה</small>"}</div>`}
      <h4>מה כולל המארז</h4><ul class="inc">${incHTML(p)}</ul>
      ${p.note?`<div class="note">💡 ${esc(p.note)}</div>`:""}
      ${brandHTML}
    </div></div>
    <div class="err" id="err">הכמות המינימלית למארז זה היא ${minQ} יחידות</div>
    ${quote?`<div class="buy"><a class="cta wa" href="${waLink(`היי, אשמח להצעת מחיר על ${p.name}`)}" target="_blank" rel="noopener">${waIcon}הצעת מחיר מ־OR Design</a></div>`
    :`<div class="buy"><div class="qty"><button data-d="1" aria-label="הוספה">+</button><input id="qn" type="number" inputmode="numeric" value="${minQ}" min="${minQ}" aria-label="כמות"><button data-d="-1" aria-label="הפחתה">−</button></div><button class="cta" id="add">הוספה · <span id="sum"></span></button></div>`}`);
  const gal=$("#gal"), dots=$("#dots");
  if(dots) gal.addEventListener("scroll",()=>{const i=Math.round(Math.abs(gal.scrollLeft)/gal.clientWidth);dots.querySelectorAll("span").forEach((s,k)=>s.classList.toggle("on",k===i))},{passive:true});
  if(quote) return;
  const qn=$("#qn"), upd=()=>{const n=+qn.value||0;$("#sum").textContent=fmt(Math.round(n*p.v[vi][1]*10)/10);$("#err").style.display=n<minQ?"block":"none"};
  sheet.querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{qn.value=Math.max(minQ,(+qn.value||0)+ +b.dataset.d*(minQ>=10?1:1));upd()});
  qn.oninput=upd;
  const vars=$("#vars"); if(vars) vars.onclick=e=>{const b=e.target.closest(".variant");if(!b)return;vi=+b.dataset.i;vars.querySelectorAll(".variant").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()};
  $("#add").onclick=()=>{const n=+qn.value||0;if(n<minQ){$("#err").style.display="block";return}
    const ex=cart.find(c=>c.id===p.id&&c.vi===vi); if(ex) ex.qty=n; else cart.push({id:p.id,vi,qty:n});
    saveCart();closeSheet()};
  upd();
}

/* ======= רשימת הזמנה ======= */
const lineTotal=c=>{const p=P.find(x=>x.id===c.id);return c.qty*p.v[c.vi][1]};
function saveCart(){cart=cart.filter(c=>P.find(x=>x.id===c.id));store.set("or-cart",cart);
  const n=cart.length, t=cart.reduce((s,c)=>s+lineTotal(c),0);
  $("#bN").textContent=n;$("#bT").textContent=fmt(Math.round(t*10)/10);$("#basketBar").classList.toggle("show",n>0);render()}
function cartText(){
  const lines=cart.map(c=>{const p=P.find(x=>x.id===c.id),v=p.v[c.vi];return `• ${p.name}${v[0]?` (${v[0]})`:""} — ${c.qty} יח׳ × ${fmt(v[1])} = ${fmt(Math.round(lineTotal(c)*10)/10)}`});
  const t=cart.reduce((s,c)=>s+lineTotal(c),0);
  return `היי OR Design Studio! אשמח להזמין מהקטלוג:\n${lines.join("\n")}\n\nסה״כ משוער: ${fmt(Math.round(t*10)/10)}\n\nתאריך האירוע: \nנוסח ההקדשה: `;
}
const waIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9 0-1.4.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>`;
const waLink=t=>`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
function openCart(){
  if(!cart.length) return;
  const t=cart.reduce((s,c)=>s+lineTotal(c),0);
  openSheet(`<div class="scroll"><div class="detail" style="padding-top:18px">
    <div class="cart-head"><div class="lg" data-logo></div><div><h2>הרשימה שלי</h2><p class="fine" style="margin:2px 0 6px">שולחים את הרשימה ל־OR Design בוואטסאפ ומקבלים אישור והצעה סופית.</p></div></div>
    ${cart.map((c,i)=>{const p=P.find(x=>x.id===c.id),v=p.v[c.vi];return `<div class="line" data-i="${i}"><img src="${src(p.img[0])}" alt=""><div class="t"><b>${esc(p.name)}</b><span>${v[0]?esc(v[0])+" · ":""}${fmt(v[1])} ליח׳ · ${fmt(Math.round(lineTotal(c)*10)/10)}</span><br><button class="rm" data-rm="${i}">הסרה</button></div>
      <div class="qty"><button data-q="1">+</button><input type="number" inputmode="numeric" value="${c.qty}" data-in="${i}" aria-label="כמות"><button data-q="-1">−</button></div></div>`}).join("")}
    <div class="total"><span>סה״כ משוער</span><span>${fmt(Math.round(t*10)/10)}</span></div>
    <p class="fine">המחיר סופי לאחר אישור. ייתכנו תוספות (גפרורים ממותגים, משלוח).</p>
  </div></div>
  <div class="buy"><a class="cta wa" id="send" href="${waLink(cartText())}" target="_blank" rel="noopener">${waIcon}שליחה ל־OR Design <span class="who">בוואטסאפ</span></a></div>`);
  sheet.querySelectorAll(".line").forEach(row=>{const i=+row.dataset.i,c=cart[i],p=P.find(x=>x.id===c.id),m=p.min||1,inp=row.querySelector("input");
    const set=n=>{c.qty=Math.max(m,n);store.set("or-cart",cart);reopen()};
    row.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>set(c.qty+ +b.dataset.q));
    inp.onchange=()=>set(+inp.value||m);
    row.querySelector("[data-rm]").onclick=()=>{cart.splice(i,1);saveCart();cart.length?reopen():closeSheet()};});
}
function reopen(){saveCart();const y=sheet.querySelector(".scroll")?.scrollTop||0;openCart();sheet.querySelector(".scroll").scrollTop=y}
$("#basketBar").onclick=openCart;

saveCart();
</script>
</body>
</html>
